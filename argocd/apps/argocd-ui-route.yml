apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-ui
  namespace: argocd
spec:
  parentRefs:
    - name: public-gateway
      namespace: default
      sectionName: https
  hostnames:
    - argocd.nzhussup.dev
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
