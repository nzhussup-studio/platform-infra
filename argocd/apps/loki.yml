# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: platform-infra
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.7.6
    helm:
      releaseName: loki
      valuesObject:
        deploymentMode: Monolithic
        gateway: { enabled: false }
        singleBinary:
          replicas: 1
          persistence: { enabled: true, size: 10Gi }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
        loki:
          # A single local PVC is sufficient for this lightweight, non-HA deployment.
          auth_enabled: false
          commonConfig: { replication_factor: 1 }
          storage:
            type: filesystem
            filesystem:
              chunks_directory: /var/loki/chunks
              rules_directory: /var/loki/rules
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: loki_index_, period: 24h }
          limits_config: { retention_period: 168h }
          compactor: { retention_enabled: true }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
  destination: { server: "https://kubernetes.default.svc", namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
