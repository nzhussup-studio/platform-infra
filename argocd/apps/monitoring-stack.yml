apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-infra
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 89.2.0
    helm:
      releaseName: monitoring
      valuesObject:
        alertmanager: { enabled: false }
        prometheusOperator:
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 250m, memory: 256Mi } }
        prometheus:
          prometheusSpec:
            retention: 7d
            resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
        grafana:
          persistence: { enabled: true, size: 5Gi }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 300m, memory: 256Mi } }
          sidecar:
            dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
