apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Let Kubernetes apply API defaults during comparison, preventing false drift
    # from defaulted Gateway API and Envoy Gateway fields.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform-infra
  source:
    repoURL: https://github.com/nzhussup-studio/platform-infra.git
    targetRevision: main
    path: k8s/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
