apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-gateway-tls
  namespace: default
spec:
  # Do not share a target Secret with the legacy Certificate.
  secretName: public-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - nzhussup.dev
    - api.nzhussup.dev
    - admin.nzhussup.dev
    - auth.nzhussup.dev
    - study.nzhussup.dev
    - sabina.valentine.nzhussup.dev
    - argocd.nzhussup.dev
