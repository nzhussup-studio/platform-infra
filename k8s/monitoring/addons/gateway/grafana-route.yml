apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public-gateway
      namespace: default
      sectionName: https
  hostnames:
    - monitoring.nzhussup.dev
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
