apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-http-to-https
spec:
  parentRefs:
    - name: public-gateway
      sectionName: http
  hostnames:
    - nzhussup.dev
    - api.nzhussup.dev
    - admin.nzhussup.dev
    - auth.nzhussup.dev
    - study.nzhussup.dev
    - sabina.valentine.nzhussup.dev
    - argocd.nzhussup.dev
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
