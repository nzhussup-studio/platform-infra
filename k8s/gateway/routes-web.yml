apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-portfolio
spec:
  parentRefs: [{ name: public-gateway, sectionName: https }]
  hostnames: [nzhussup.dev]
  rules:
    - backendRefs: [{ name: web-portfolio-service, port: 8000 }]
