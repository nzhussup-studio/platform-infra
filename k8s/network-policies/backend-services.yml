apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-api-docs-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: backend-api-docs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: public-gateway
      ports:
        - protocol: TCP
          port: 8080
---
