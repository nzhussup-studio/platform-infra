apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api-docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api-docs
  template:
    metadata:
      labels:
        app: backend-api-docs
    spec:
      containers:
        - name: backend-api-docs
          image: nzhussup/backend-api-docs:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /docs/
              port: 8080
          livenessProbe:
            httpGet:
              path: /docs/
              port: 8080
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api-docs
spec:
  selector:
    app: backend-api-docs
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
