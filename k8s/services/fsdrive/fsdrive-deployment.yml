apiVersion: apps/v1
kind: Deployment
metadata:
  name: freestudydrive-deployment
  labels:
    app: freestudydrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freestudydrive
  template:
    metadata:
      labels:
        app: freestudydrive
    spec:
      containers:
        - name: freestudydrive
          image: nzhussup/freestudydrive:latest
          ports:
            - containerPort: 45321
          resources:
            requests:
              cpu: 2m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: KEYCLOAK_URL
              value: "https://auth.nzhussup.dev"
            - name: KEYCLOAK_REALM
              value: "backend-auth"
            - name: KEYCLOAK_CLIENT_ID
              value: "frontend-admin-auth-client"

---
apiVersion: v1
kind: Service
metadata:
  name: freestudydrive-service
  labels:
    app: freestudydrive
spec:
  selector:
    app: freestudydrive
  ports:
    - protocol: TCP
      port: 777
      targetPort: 45321
  type: ClusterIP
